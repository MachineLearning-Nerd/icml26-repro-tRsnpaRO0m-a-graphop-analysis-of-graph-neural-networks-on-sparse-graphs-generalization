<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Dense and sparse graphop certificates</title>
  <desc id="desc">A dense three-cell step graphon and sparse four-node path both satisfy exact graphop axioms.</desc>
  <rect width="1200" height="520" fill="#fbfbf8"/>
  <text x="55" y="58" font-family="sans-serif" font-size="32" font-weight="700" fill="#17212b">One operator language, two exact constructions</text>
  <rect x="55" y="105" width="500" height="320" rx="18" fill="#e8f0fa" stroke="#3b6ea8" stroke-width="2"/>
  <text x="85" y="150" font-family="sans-serif" font-size="24" font-weight="700" fill="#244f80">Dense 3-cell step graphon</text>
  <g fill="#578cc4" stroke="#fff" stroke-width="3">
    <rect x="110" y="190" width="70" height="70"/><rect x="180" y="190" width="70" height="70" opacity=".82"/><rect x="250" y="190" width="70" height="70" opacity=".66"/>
    <rect x="110" y="260" width="70" height="70" opacity=".82"/><rect x="180" y="260" width="70" height="70" opacity=".72"/><rect x="250" y="260" width="70" height="70" opacity=".55"/>
    <rect x="110" y="330" width="70" height="70" opacity=".66"/><rect x="180" y="330" width="70" height="70" opacity=".55"/><rect x="250" y="330" width="70" height="70" opacity=".75"/>
  </g>
  <text x="355" y="215" font-family="monospace" font-size="18" fill="#244f80">729 adjoint pairs</text>
  <text x="355" y="252" font-family="monospace" font-size="18" fill="#244f80">8 positive signals</text>
  <text x="355" y="289" font-family="monospace" font-size="18" fill="#244f80">residual = 0</text>
  <text x="355" y="326" font-family="monospace" font-size="18" fill="#244f80">norm = 11/35</text>
  <text x="355" y="378" font-family="sans-serif" font-size="24" font-weight="700" fill="#155a3b">GRAPHOP ✓</text>
  <rect x="645" y="105" width="500" height="320" rx="18" fill="#e7f3ea" stroke="#37855b" stroke-width="2"/>
  <text x="675" y="150" font-family="sans-serif" font-size="24" font-weight="700" fill="#215f40">Sparse path P4</text>
  <g stroke="#2c7a52" stroke-width="8"><line x1="715" y1="260" x2="805" y2="260"/><line x1="805" y1="260" x2="895" y2="260"/><line x1="895" y1="260" x2="985" y2="260"/></g>
  <g fill="#fff" stroke="#2c7a52" stroke-width="6"><circle cx="715" cy="260" r="24"/><circle cx="805" cy="260" r="24"/><circle cx="895" cy="260" r="24"/><circle cx="985" cy="260" r="24"/></g>
  <text x="690" y="320" font-family="monospace" font-size="18" fill="#215f40">fiber mass: 1, 2, 2, 1</text>
  <text x="690" y="355" font-family="monospace" font-size="18" fill="#215f40">residual = 0 · norm = 3/2</text>
  <text x="690" y="395" font-family="sans-serif" font-size="24" font-weight="700" fill="#155a3b">GRAPHOP + BOFOP ✓</text>
  <text x="55" y="470" font-family="sans-serif" font-size="18" fill="#455565">Controls: asymmetric positive operator fails self-adjointness; symmetric negative edge fails positivity.</text>
  <text x="55" y="500" font-family="sans-serif" font-size="18" fill="#455565">A countable graphop with unbounded fibers is correctly rejected as a bofop.</text>
</svg>
