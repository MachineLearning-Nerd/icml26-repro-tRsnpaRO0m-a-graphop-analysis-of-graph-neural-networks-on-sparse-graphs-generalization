<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
  <title id="title">Scale and coverage of the finite graphop and bofop certificates</title>
  <desc id="desc">Six graph families cover thirty-four instances through sixteen thousand three hundred eighty-four vertices.</desc>
  <rect width="1200" height="530" fill="#fbfbf8"/>
  <text x="55" y="58" font-family="sans-serif" font-size="32" font-weight="700" fill="#17212b">Parameterized certificate, exercised across six families</text>
  <g font-family="sans-serif" font-size="18">
    <text x="70" y="115" fill="#455565">dense step graphons</text><rect x="330" y="91" width="270" height="30" rx="5" fill="#4f83bd"/><text x="620" y="114" fill="#244f80">4 instances · n≤256</text>
    <text x="70" y="175" fill="#455565">paths</text><rect x="330" y="151" width="700" height="30" rx="5" fill="#31835a"/><text x="1050" y="174" fill="#215f40">7 · n≤16,384</text>
    <text x="70" y="235" fill="#455565">weighted cycles</text><rect x="330" y="211" width="610" height="30" rx="5" fill="#3f9368"/><text x="960" y="234" fill="#215f40">6 · n≤8,192</text>
    <text x="70" y="295" fill="#455565">degree-four circulants</text><rect x="330" y="271" width="610" height="30" rx="5" fill="#55a579"/><text x="960" y="294" fill="#215f40">6 · n≤8,192</text>
    <text x="70" y="355" fill="#455565">stars</text><rect x="330" y="331" width="530" height="30" rx="5" fill="#72b58e"/><text x="880" y="354" fill="#215f40">6 · n≤4,096</text>
    <text x="70" y="415" fill="#455565">nonuniform reversible chains</text><rect x="330" y="391" width="430" height="30" rx="5" fill="#8cc2a0"/><text x="780" y="414" fill="#215f40">5 · n≤1,024</text>
  </g>
  <rect x="55" y="455" width="1090" height="52" rx="10" fill="#e8f0fa"/>
  <text x="80" y="489" font-family="sans-serif" font-size="20" font-weight="700" fill="#244f80">34 instances · 448,593,904 operator cells · exact rational arithmetic · every norm identity passes</text>
</svg>
