<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Probability of an infinite uniform generalization gap</title>
  <desc id="desc">For even sample sizes two through 128, the exact probability increases from one half to about 0.93; every odd size has probability one.</desc>
  <rect width="1200" height="560" fill="#fbfbf8"/>
  <text x="60" y="58" font-family="sans-serif" font-size="32" font-weight="700" fill="#17212b">The bad event becomes more likely—not less</text>
  <text x="60" y="92" font-family="sans-serif" font-size="18" fill="#455565">Exact even-N probability: 1 − C(N,N/2)/2ᴺ · every odd N: 1</text>
  <g stroke="#9aa8b5" stroke-width="1">
    <line x1="110" y1="440" x2="1130" y2="440"/><line x1="110" y1="360" x2="1130" y2="360"/><line x1="110" y1="280" x2="1130" y2="280"/><line x1="110" y1="200" x2="1130" y2="200"/><line x1="110" y1="120" x2="1130" y2="120"/>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#526474" text-anchor="end">
    <text x="95" y="446">0.5</text><text x="95" y="366">0.625</text><text x="95" y="286">0.75</text><text x="95" y="206">0.875</text><text x="95" y="126">1.0</text>
  </g>
  <polyline points="140,440 300,360 460,295 620,246 780,210 940,183 1100,165" fill="none" stroke="#b43b2b" stroke-width="6"/>
  <g fill="#fde2dd" stroke="#b43b2b" stroke-width="4">
    <circle cx="140" cy="440" r="10"/><circle cx="300" cy="360" r="10"/><circle cx="460" cy="295" r="10"/><circle cx="620" cy="246" r="10"/><circle cx="780" cy="210" r="10"/><circle cx="940" cy="183" r="10"/><circle cx="1100" cy="165" r="10"/>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#526474" text-anchor="middle">
    <text x="140" y="475">2</text><text x="300" y="475">4</text><text x="460" y="475">8</text><text x="620" y="475">16</text><text x="780" y="475">32</text><text x="940" y="475">64</text><text x="1100" y="475">128</text>
  </g>
  <text x="620" y="520" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#455565">sample size N (even subsequence)</text>
  <text x="1100" y="142" text-anchor="end" font-family="sans-serif" font-size="18" font-weight="700" fill="#7e281e">0.9296</text>
  <text x="30" y="290" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#455565" transform="rotate(-90 30 290)">bad-event probability</text>
</svg>
